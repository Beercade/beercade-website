<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beercade — Redfern</title>
    <meta
      name="description"
      content="Beercade — pinball, arcade, cold beer. 113–115 Regent Street, Redfern. The site's being rebuilt; back shortly."
    />
    <!-- Holding page: keep it out of the index so it doesn't replace the real
         site in search results once that's live. -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --last-train-purple: #2a1745;
        --after-dark: #14101a;
        --crema: #f7efe3;
        --tilt-purple: #7a3ce2;
        --high-score-orange: #ff5e1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background-color: var(--last-train-purple);
        background-image: radial-gradient(
            circle at 74% 22%,
            rgba(122, 60, 226, 0.5),
            transparent 46%
          ),
          radial-gradient(
            circle at 22% 84%,
            rgba(255, 94, 31, 0.22),
            transparent 44%
          );
        color: var(--crema);
        font-family: "Archivo", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      main {
        width: 100%;
        max-width: 620px;
        text-align: center;
      }
      .logo {
        width: min(360px, 74vw);
        height: auto;
        margin: 0 auto;
      }
      .kicker {
        margin: 36px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--high-score-orange);
      }
      h1 {
        font-family: "Archivo Black", "Archivo", sans-serif;
        font-weight: 400;
        font-size: clamp(40px, 9vw, 68px);
        line-height: 1.02;
        letter-spacing: -0.01em;
        margin: 14px 0 0;
        color: var(--crema);
      }
      .lead {
        margin: 22px auto 0;
        max-width: 46ch;
        font-size: clamp(16px, 2.4vw, 18px);
        line-height: 1.6;
        color: rgba(247, 239, 227, 0.82);
      }
      .contact {
        margin: 28px 0 0;
        font-size: 14px;
        line-height: 1.7;
        color: rgba(247, 239, 227, 0.6);
      }
      .contact a {
        color: var(--high-score-orange);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 94, 31, 0.35);
        white-space: nowrap;
      }
      .contact a:hover {
        border-bottom-color: var(--high-score-orange);
      }
      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: rise 0.6s ease-out both;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
